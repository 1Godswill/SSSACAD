<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ST. STEPHEN'S SCHOOL OTUOKE</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#142544">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="St. Stephen's">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3.10.8">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3.10.8">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=3.10.8">

<style>
  :root{
    /* ---- New design language, matched to the reference dashboard: a
       cohesive navy + blue identity instead of the old per-tab rainbow
       theme, white cards on a cool light background, and a small set of
       semantic colors (success/danger/warning/purple/orange) used for
       status and category, not for re-theming whole screens. ---- */
    --navy:#142544; --navy-2:#1c3766; --brand:#2f6feb; --brand-light:#e9f1fd;
    --bg:#eef2f8; --card:#ffffff; --text:#16233d; --muted:#6b7688; --border:#e4e9f2;
    --success:#1fa971; --success-bg:#e2f8ee;
    --danger:#e2507b; --danger-bg:#fdeaf1;
    --warning:#f2a93b; --warning-bg:#fdf1dd;
    --purple:#7c5cfc; --purple-bg:#efeafe;
    --orange:#f0904a; --orange-bg:#fdece0;

    /* Legacy variable names kept as aliases so every existing inline
       style in the JS files (var(--green), var(--gold), var(--tabAccent),
       etc.) keeps working without touching those files — they now all
       resolve into the one consistent palette above instead of a
       different color per tab. */
    --green:var(--brand); --green-dark:var(--navy); --gold:var(--warning); --red:var(--danger); --blue:var(--brand-light);
    --tabAccent:var(--brand); --tabAccentBg:var(--brand-light); --tabAccentDark:var(--navy);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);position:relative;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:url('icons/logo.png');background-repeat:repeat;background-size:90px 90px;opacity:.03;}
  header{background:var(--navy);color:#fff;padding:14px 16px;position:fixed;top:0;left:0;right:0;z-index:30;box-shadow:0 2px 10px rgba(16,35,64,.18);}
  header h1{margin:0;font-size:16px;font-weight:700;}
  header p{margin:2px 0 0;font-size:11px;opacity:.8;}
  nav{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--navy-2);position:fixed;left:0;right:0;z-index:29;padding:6px 8px;}
  nav button{flex:0 0 auto;background:none;border:none;color:#fff;padding:9px 14px;font-size:13px;opacity:.75;white-space:nowrap;border-radius:9px;font-weight:600;}
  nav button.active{opacity:1;background:var(--brand);}
  main{padding:150px 12px 60px;max-width:900px;margin:0 auto;}
  /* ---- Tab cards: 3 per row, each with a glossy 3D-style animated icon ---- */
  nav#tabs{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow:visible;background:none;padding:0;margin:0 0 14px;}
  nav#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;padding:12px 4px 10px;
    background:var(--card);border:1px solid var(--border);border-radius:18px;color:var(--text);opacity:1;font-size:12px;font-weight:700;line-height:1.2;
    white-space:normal;text-align:center;box-shadow:0 2px 8px rgba(16,35,64,.08);transition:transform .15s,box-shadow .2s,background .2s;-webkit-tap-highlight-color:transparent;}
  nav#tabs button:active{transform:scale(.95);}
  nav#tabs button.active{background:var(--brand-light);border-color:var(--brand);color:var(--navy);box-shadow:0 0 0 2px var(--brand),0 8px 18px rgba(47,111,235,.25);}
  nav#tabs .ic{width:48px;height:48px;overflow:visible;flex:0 0 auto;filter:drop-shadow(0 4px 4px rgba(20,37,68,.22));}
  nav#tabs .ic-body{animation:icFloat 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
  nav#tabs .ic-shadow{animation:icShadow 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  nav#tabs button:nth-child(2) .ic-body,nav#tabs button:nth-child(2) .ic-shadow{animation-delay:-.5s;}
  nav#tabs button:nth-child(3) .ic-body,nav#tabs button:nth-child(3) .ic-shadow{animation-delay:-1s;}
  nav#tabs button:nth-child(4) .ic-body,nav#tabs button:nth-child(4) .ic-shadow{animation-delay:-1.5s;}
  nav#tabs button:nth-child(5) .ic-body,nav#tabs button:nth-child(5) .ic-shadow{animation-delay:-2s;}
  nav#tabs button:nth-child(6) .ic-body,nav#tabs button:nth-child(6) .ic-shadow{animation-delay:-2.5s;}
  nav#tabs button.active .ic{transform:scale(1.1);transition:transform .2s;}
  nav#tabs button.active .ic-body{animation-duration:1.8s;}
  @keyframes icFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-3px) scale(1.04);}}
  @keyframes icShadow{0%,100%{transform:scaleX(1);opacity:.14;}50%{transform:scaleX(.8);opacity:.08;}}
  /* per-icon details */
  .ic .tick{stroke-dasharray:14;stroke-dashoffset:14;animation:icTick 3.6s ease-in-out infinite;}
  .ic .tick.t2{animation-delay:.5s;} .ic .tick.t3{animation-delay:1s;}
  @keyframes icTick{0%{stroke-dashoffset:14;}25%,80%{stroke-dashoffset:0;}100%{stroke-dashoffset:14;}}
  .ic .pencil{animation:icWrite 1.8s ease-in-out infinite;}
  @keyframes icWrite{0%,100%{transform:translate(0,0);}50%{transform:translate(-5px,2px);}}
  .ic .scribble{stroke-dasharray:40;stroke-dashoffset:40;animation:icScribble 1.8s ease-in-out infinite;}
  @keyframes icScribble{0%{stroke-dashoffset:40;}60%,100%{stroke-dashoffset:0;}}
  .ic .bar{transform-box:fill-box;transform-origin:50% 100%;animation:icBar 2.6s ease-in-out infinite;}
  .ic .bar.b2{animation-delay:.25s;} .ic .bar.b3{animation-delay:.5s;}
  @keyframes icBar{0%,100%{transform:scaleY(.55);}50%{transform:scaleY(1);}}
  .ic .badge{transform-box:fill-box;transform-origin:center;animation:icBadge 2.4s ease-in-out infinite;}
  @keyframes icBadge{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(8deg) scale(1.1);}}
  .ic .cell{animation:icCell 2.4s ease-in-out infinite;}
  .ic .cell.c2{animation-delay:.3s;} .ic .cell.c3{animation-delay:.6s;} .ic .cell.c4{animation-delay:.9s;} .ic .cell.c5{animation-delay:1.2s;} .ic .cell.c6{animation-delay:1.5s;}
  @keyframes icCell{0%,100%{opacity:.55;}50%{opacity:1;}}
  .ic .head{transform-box:fill-box;transform-origin:50% 100%;animation:icNod 3.2s ease-in-out infinite;}
  @keyframes icNod{0%,100%{transform:translateY(0);}50%{transform:translateY(-1.5px);}}
  @media (prefers-reduced-motion:reduce){ nav#tabs *,.ic *{animation:none !important;} .ic .tick,.ic .scribble{stroke-dashoffset:0 !important;} }

  .tab{display:none;}
  .tab.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,35,64,.05);}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--text);font-weight:700;}
  @media print{ .card{background:#fff !important;box-shadow:none !important;} }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:8px;font-weight:600;}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff;color:var(--text);}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;}
  button.btn{background:var(--brand);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-top:12px;width:100%;}
  button.btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  button.btn.danger{background:var(--danger);}
  button.btn.small{width:auto;padding:6px 10px;font-size:12px;margin-top:0;border-radius:8px;}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-size:11.5px;font-weight:700;}
  .enroll-row td{background:var(--brand-light);border-bottom:2px solid var(--brand);}
  .link-btn:hover{text-decoration:underline;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.gA{background:var(--success-bg);color:var(--success);}
  .badge.gB{background:var(--success-bg);color:var(--success);}
  .badge.gC{background:var(--warning-bg);color:#9a6c10;}
  .badge.gD{background:var(--orange-bg);color:#a05516;}
  .badge.gE{background:var(--danger-bg);color:var(--danger);}
  .badge.gF{background:var(--danger-bg);color:var(--danger);}
  .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
  .stat b{color:var(--text);}
  .studentcard{padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff;}
  .studentcard .toprow{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .studentcard b{font-size:14px;}
  .studentcard .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .rank-pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:12px;margin-right:10px;}

  /* ---- Student name tags: colour-coded avatar + name, reused across
     Students, Register, Score Entry and Class Report so a given student
     carries the same colour everywhere they appear ---- */
  .tag-avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:10.5px;font-weight:800;letter-spacing:.2px;flex:0 0 auto;}
  .student-tag{display:inline-flex;align-items:center;gap:7px;max-width:100%;vertical-align:middle;}
  .student-tag .tag-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .student-tag .tag-gender{flex:0 0 auto;display:inline-flex;opacity:.8;}
  .tag-staggered{display:inline-flex;margin-left:6px;color:var(--warning);opacity:.9;vertical-align:middle;}
  td .student-tag, .link-btn .student-tag{max-width:100%;}

  /* ---- Drag-and-drop reordering (Students tab) ---- */
  .drag-handle{flex:0 0 auto;display:inline-flex;align-items:center;padding:4px 3px;margin-right:2px;color:var(--muted);cursor:grab;touch-action:none;}
  .drag-handle:active{cursor:grabbing;}
  .student-row{transition:background-color .15s;border-radius:8px;}
  .student-row.dragging{opacity:.55;background:var(--brand-light);}
  .detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .detail.open{display:block;}
  .section-title{font-size:12px;font-weight:700;color:var(--text);margin:14px 0 4px;letter-spacing:.2px;}
  .empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .subtable-wrap{overflow-x:auto;}
  .comment-box{background:var(--brand-light);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--navy);margin-top:10px;}

  /* ---- Everything in capitals (typed text is also converted as it's entered — see the input handler below).
     .no-caps opts a field out: access codes and the sync URL are case-sensitive. ---- */
  body,input,textarea,select,button{text-transform:uppercase;}
  .no-caps,.no-caps *,input[type=password],input[type=file]{text-transform:none !important;}

  /* Timestamp stamped onto every printed / exported document (Report Card, Class Report,
     Broadsheet, PDF export). Invisible on screen; shown fixed at the foot of every printed
     page by the browser's print engine — including multi-page prints. */
  #printStamp{display:none;}
  @media print{
    #printStamp{display:block !important;position:fixed;left:0;right:0;bottom:3mm;
      text-align:center;font-size:7.5px;letter-spacing:.2px;color:#666;z-index:99999;}
  }
  #classBar{background:#fff;border-bottom:1px solid var(--border);padding:8px 12px;position:fixed;left:0;right:0;z-index:28;display:flex;gap:8px;align-items:center;max-width:900px;margin:0 auto;box-shadow:0 1px 3px rgba(16,35,64,.04);}
  #classBar button{white-space:nowrap;}
  #classBar .adm-wrap{flex:1 1 100%;min-width:0;}
  .adm-top{display:flex;align-items:center;gap:8px;}
  .adm-title{flex:1;font-weight:800;font-size:13.5px;}
  .adm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px;}
  button.adm-card{min-height:32px;padding:4px 1px;border:none;border-radius:9px;margin:0;width:100%;
    background:linear-gradient(135deg,var(--c1,#3b5bdb),var(--c2,#1c2f7a));color:#fff;font-size:10px;font-weight:800;letter-spacing:0;line-height:1.1;white-space:nowrap;
    box-shadow:0 2px 5px rgba(20,37,68,.25),inset 0 1px 0 rgba(255,255,255,.25);}
  button.adm-card.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c2,#1c2f7a),0 3px 8px rgba(20,37,68,.3);}
  button.adm-card:active{transform:scale(.95);}

  /* ---- Login gate: full-screen class picker + access-code / admin front
     door, shown before any class's data is visible (see login.js) ---- */

  /* Scrolling notice on the class-select screen: right to left, edge to edge. */
  .gate-marquee{position:fixed;left:0;right:0;top:0;z-index:501;overflow:hidden;
    background:var(--navy);color:#fff;padding:7px 0;font-size:12.5px;font-weight:700;letter-spacing:.3px;
    white-space:nowrap;pointer-events:none;}
  /* translateX(100%) start (just off the right edge) to translateX(-100%) end (fully past the left edge)
     guarantees the whole line crosses and clears the entire screen width, at whatever the element's own
     width turns out to be — not tied to a fixed pixel amount. */
  .gate-marquee span{display:inline-block;white-space:nowrap;animation:gateMarquee 24s linear infinite;
    transform:translateX(100%);}
  @keyframes gateMarquee{from{transform:translateX(100%);}to{transform:translateX(-100%);}}
  #loginGate{display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;
    background:linear-gradient(rgba(255,255,255,.80),rgba(255,255,255,.80)),url(icons/school-bg.jpg) center/cover no-repeat,#f4f6fb;}
  .gate-card{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:24px 18px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 18px 48px rgba(20,37,68,.22);}
  .gate-logo{width:56px;height:56px;border-radius:14px;margin-bottom:8px;}
  .gate-title{margin:0;font-size:18px;font-weight:800;color:var(--navy);}
  .gate-sub{margin:4px 0 18px;font-size:13px;color:var(--muted);}
  .gate-card-wide{max-width:600px;padding:20px 12px 16px;background:rgba(255,255,255,.40);}
  .entry-rejected{outline:2px solid #c62828 !important;background:#ffebee !important;}
  .gate-pick-head{margin:4px 0 14px;text-align:center;}
  .gate-pick-cap{width:26px;height:26px;margin:0 auto 2px;color:var(--navy);}
  .gate-pick-cap svg{width:100%;height:100%;display:block;}
  .gate-pick-title{display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;font-weight:800;letter-spacing:.2px;color:var(--navy);text-transform:none;text-align:center;}
  .gate-pick-title::before,.gate-pick-title::after{content:"";flex:1;max-width:60px;height:2px;border-radius:2px;background:#b3166f;}
  .gate-pick-sub{margin-top:3px;font-size:12px;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;}
  .gate-class-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .gate-class-btn{position:relative;display:flex;align-items:center;gap:6px;min-height:52px;padding:7px 6px 7px 11px;border:1px solid rgba(20,37,68,.06);border-radius:14px;overflow:hidden;text-align:left;
    background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(20,37,68,.14);transition:transform .12s,box-shadow .12s;}
  .gate-class-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--c1,#3b5bdb),var(--c2,#1c2f7a));}
  .gate-ico{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,var(--c1,#3b5bdb),var(--c2,#1c2f7a));box-shadow:0 2px 5px rgba(20,37,68,.22);}
  .gate-ico svg{width:17px;height:17px;display:block;}
  .gate-cname{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:800;letter-spacing:0;line-height:1;white-space:nowrap;color:var(--navy);}
  .gate-chev{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:#eef1f7;color:#6b7a99;display:flex;align-items:center;justify-content:center;}
  .gate-chev svg{width:9px;height:9px;display:block;}
  .gate-lock{position:absolute;top:2px;right:4px;font-size:8px;opacity:.85;line-height:1;}
  @media (max-width:559px){
    .gate-chev{display:none;}
    .gate-class-btn{padding:7px 2px 7px 9px;gap:5px;}
    .gate-ico{width:25px;height:25px;border-radius:8px;}
    .gate-ico svg{width:15px;height:15px;}
    .gate-cname{font-size:11.5px;}
  }
  @media (min-width:560px){
    .gate-class-list{gap:12px;}
    .gate-class-btn{min-height:62px;padding:9px 12px 9px 15px;gap:10px;}
    .gate-ico{width:36px;height:36px;border-radius:11px;}
    .gate-ico svg{width:21px;height:21px;}
    .gate-cname{font-size:15px;}
    .gate-chev{width:22px;height:22px;}
    .gate-chev svg{width:12px;height:12px;}
    .gate-lock{top:4px;right:7px;font-size:10px;}
  }
  @keyframes gateClassPop{from{opacity:0;transform:translateY(8px) scale(.85);}to{opacity:1;transform:none;}}
  .gate-class-btn{opacity:0;animation:gateClassPop .3s ease-out forwards;}
  .gate-class-btn.selected{background:linear-gradient(135deg,var(--c1,#3b5bdb),var(--c2,#1c2f7a));border-color:transparent;transform:scale(.97);box-shadow:0 0 0 2px #fff,0 5px 14px rgba(20,37,68,.35);}
  .gate-class-btn.selected .gate-cname{color:#fff;}
  .gate-class-btn.selected .gate-ico{background:#fff;color:var(--c2,#1c2f7a);}
  .gate-class-btn.selected .gate-chev{background:rgba(255,255,255,.25);color:#fff;}
  @media (prefers-reduced-motion:reduce){.gate-class-btn{animation-duration:.01s;}}
  .gate-class-btn:active{transform:translateY(1px) scale(.97);box-shadow:0 1px 4px rgba(20,37,68,.25);}
  .gate-admin-link{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:11px 16px;border:none;border-radius:999px;color:#fff;font-size:14px;font-weight:800;letter-spacing:.8px;text-decoration:none;
    background:linear-gradient(90deg,#b3166f,#5b2a9e);box-shadow:0 4px 12px rgba(91,42,158,.35);}
  .gate-admin-gear{width:20px;height:20px;display:block;}
  .gate-admin-gear svg{width:100%;height:100%;display:block;}
  .gate-admin-sep{width:1px;height:18px;background:rgba(255,255,255,.55);}
  .gate-admin-txt{flex:1;text-align:left;}
  .gate-admin-chev{width:16px;height:16px;display:block;}
  .gate-admin-chev svg{width:100%;height:100%;display:block;}
  .gate-back-link{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;margin-top:14px;padding:6px;}

  /* Admin lock screen: full-screen, keyboard only */
  .gate-admin-lock{position:relative;max-width:420px;padding:22px 10px 14px;}
  .gate-admin-lockico{font-size:34px;line-height:1;margin-bottom:4px;}
  .gate-admin-exit{position:absolute;top:8px;right:8px;width:42px;height:42px;border:none;border-radius:12px;background:rgba(255,255,255,.7);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .gate-admin-dots{height:34px;line-height:34px;margin:6px 8px 12px;border:1.5px solid var(--border);border-radius:10px;background:rgba(255,255,255,.85);font-size:16px;letter-spacing:4px;color:var(--navy);overflow:hidden;white-space:nowrap;}
  .gate-kb{display:flex;flex-direction:column;gap:6px;}
  .gate-kb-row{display:flex;gap:4px;justify-content:center;}
  .gate-key{flex:1 1 0;min-width:0;height:44px;border:1px solid rgba(20,37,68,.12);border-radius:9px;background:#fff;color:var(--navy);font-size:17px;font-weight:700;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .gate-key:active{background:#e3e8f5;}
  .gate-key-fn{flex:1.5 1 0;background:#eef1f7;}

  .bs-wrap{border:2px solid #000;background:#fff;font-family:Georgia,'Times New Roman',serif;color:#000;position:relative;overflow:hidden;}

<script>
/* Force capitals for anything typed into a text box or note. Case-sensitive fields opt out with class "no-caps". */
document.addEventListener("input", function (e) {
  var t = e.target;
  if (!t || t.classList.contains("no-caps")) return;
  var isText = (t.tagName === "INPUT" && (!t.type || t.type === "text" || t.type === "search")) || t.tagName === "TEXTAREA";
  if (!isText) return;
  var up = t.value.toUpperCase();
  if (up === t.value) return;
  var a = t.selectionStart, b = t.selectionEnd;
  t.value = up;
  try { t.setSelectionRange(a, b); } catch (err) {}
}, true);
</script>

<script>
  /* ---- Offline support + automatic update detection ----
     The service worker is re-checked whenever the app comes back to the
     screen, when the internet returns, and every 30 minutes. If a newer
     version has been uploaded, a green bar offers "Update now" — nothing
     reloads by itself, so nobody loses a half-typed score. */
  function showUpdateBanner() {
    if (document.getElementById("updateBanner")) return;
    const bar = document.createElement("div");
    bar.id = "updateBanner";
    bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#1e6b3c;color:#fff;" +
      "padding:12px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;gap:10px;" +
      "align-items:center;justify-content:space-between;font-size:14px;";
    bar.innerHTML = '<span>A new version is ready.</span>' +
      '<span><button id="updateNowBtn" style="background:#fff;color:#1e6b3c;border:0;border-radius:6px;padding:7px 12px;font-weight:600;">Update now</button> ' +
      '<button id="updateLaterBtn" style="background:transparent;color:#fff;border:0;padding:7px 8px;">Later</button></span>';
    document.body.appendChild(bar);
    document.getElementById("updateNowBtn").addEventListener("click", () => location.reload());
    document.getElementById("updateLaterBtn").addEventListener("click", () => bar.remove());
  }

  if ("serviceWorker" in navigator && !(window.Capacitor && typeof Capacitor.isNativePlatform === "function" && Capacitor.isNativePlatform())) {
    let hadController = !!navigator.serviceWorker.controller; // false on the very first install
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController) showUpdateBanner();
      hadController = true;
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then((reg) => {
        const checkForUpdate = () => { if (navigator.onLine) reg.update().catch(() => {}); };
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
        window.addEventListener("online", checkForUpdate);
        setInterval(checkForUpdate, 30 * 60 * 1000);
      }).catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    });
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function showInstallInstructions() {
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const isAndroid = /Android/.test(ua);
    let steps;
    if (isIOS) {
      steps = ["Tap the Share icon (square with an arrow) in Safari's toolbar",
        'Scroll down and tap "Add to Home Screen"', "Tap \"Add\" in the top right"];
    } else if (isAndroid) {
      steps = ["Tap the ⋮ menu in the top right of Chrome",
        'Tap "Add to Home screen" or "Install app"', "Confirm — the app icon appears on your home screen"];
    } else {
      steps = ["Look for an install icon (⊕) in the browser's address bar",
        'Or open the browser menu and choose "Install St Stephen\'s Report Card..."',
        "Confirm — the app opens in its own window like a desktop app"];
    }
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>Install this app</h3>
        <ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol>
        <button class="btn secondary" id="closeInstallModal">Got it</button>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById("closeInstallModal").addEventListener("click", () => overlay.remove());
  }

  document.addEventListener("DOMContentLoaded", () => {
    const installBtn = document.getElementById("installAppBtn");
    if (!installBtn) return;
    if (isStandalone()) {
      installBtn.style.display = "none"; // already installed/running as an app
      return;
    }
    installBtn.addEventListener("click", async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        showInstallInstructions();
      }
    });
  });
</script>
</body>
</html>
